name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Unpack project
        run: |
          unzip -q tu3journal-github.zip -d proj
          ls -R proj | head -50

      - name: Download Forge MDK 1.12.2
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Insert mod sources
        run: |
          rm -rf mdk/src
          cp -r proj/src mdk/src
          sed -i 's/^version *=.*/version = "1.0.0"/' mdk/build.gradle
          sed -i 's/^group *=.*/group = "ru.tu3.journal"/' mdk/build.gradle
          sed -i 's/^archivesBaseName *=.*/archivesBaseName = "tu3journal"/' mdk/build.gradle
          echo "org.gradle.jvmargs=-Xmx3G" >> mdk/gradle.properties

      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew setupDecompWorkspace build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tu3journal-jar
          path: mdk/build/libs/*.jar
